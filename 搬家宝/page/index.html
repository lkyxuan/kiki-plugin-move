<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>搬家</title>
<style>
  * { box-sizing: border-box; }
  body { padding: 24px; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .top h1 { font-size: 20px; font-weight: 600; margin: 0 auto 0 0; }
  .top h1 small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 8px; }
  button { font: inherit; border: 0; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .btn { padding: 6px 12px; border-radius: 8px; background: var(--fill); color: var(--text); font-size: 13px; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); color: var(--on-accent, #fff); }
  .btn.link { background: none; color: var(--accent); padding: 0; font-size: 12.5px; }
  .btn.link:hover { text-decoration: underline; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 10px; }
  .meta { font-size: 12.5px; color: var(--muted); }
  .meta:empty { display: none; }
  .tw { overflow-x: auto; background: var(--card); border-radius: 12px; box-shadow: var(--shadow-sm); border: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--faint); font-size: 12px; padding: 8px 12px; }
  td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
  td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td .sub { display: block; color: var(--faint); font-size: 12px; }
  .ok { color: var(--text); font-weight: 500; }
  #main { display: flex; flex-direction: column; gap: 20px; }
  .none { color: var(--faint); }
  .card { background: var(--card); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
  .card p { margin: 0; font-size: 13.5px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .notes { font-size: 13px; color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); border-radius: 10px; padding: 10px 12px; margin: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .notes:empty { display: none; }
  .empty { text-align: center; padding: 40px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
  @media (max-width: 560px) { body { padding: 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>搬家<small id="sum"></small></h1>
    <button class="btn" id="open">打开文件夹</button>
    <button class="btn" id="zip">打包成 zip</button>
    <button class="btn primary" id="go">现在收一次</button>
  </div>
  <div class="meta" id="say"></div>
  <ul class="notes" id="notes"></ul>
  <div id="main"></div>
</div>
<script>
// 读 data/状态.json（skills/banjia/collect.mjs 写的）。按钮都交给搬家宝去办。
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// 七类家当：key 对应 状态.json 的 counts；cloud 是本机读不到、要去官网导出的部分
const KINDS = [
  { key: "记忆", name: "记忆", cloud: [["Claude 网页", "https://claude.ai/settings"], ["ChatGPT", "https://chatgpt.com/#settings/Personalization"]] },
  { key: "聊天", name: "聊天", cloud: [["Claude 网页", "https://claude.ai/settings/data-privacy-controls"], ["ChatGPT", "https://chatgpt.com/#settings/DataControls"]] },
  { key: "账号数据", name: "账号数据", hint: "官网导出的 ZIP", cloud: [["Claude", "https://claude.ai/settings/data-privacy-controls"], ["ChatGPT", "https://chatgpt.com/#settings/DataControls"]] },
  { key: "Skill", name: "自建 Skill", hint: "含子 agent、命令、提示词", cloud: [["Claude 网页", "https://claude.ai/settings"]] },
  { key: "指令", name: "个人和项目指令", cloud: [["Claude 项目", "https://claude.ai/projects"], ["ChatGPT", "https://chatgpt.com/#settings/Personalization"]] },
  { key: "连接器", name: "连接器和插件", hint: "只记名单，密钥打码", cloud: [["Claude 网页", "https://claude.ai/settings/connectors"]] },
  { key: "附件", name: "附件和成果文件", cloud: [] },
];

const ago = (iso) => {
  const d = new Date(iso);
  if (!iso || isNaN(d)) return "";
  const hm = d.toTimeString().slice(0, 5), days = Math.floor((Date.now() - d) / 864e5);
  return d.toDateString() === new Date().toDateString() ? `今天 ${hm}` : days <= 1 ? `昨天 ${hm}` : `${days} 天前`;
};
const kTok = (n) => (n < 1000 ? "不到 1k" : n < 1e6 ? `${Math.round(n / 1000)}k` : `${(n / 1e6).toFixed(1)}M`);

let st = null;
async function load() {
  try { st = JSON.parse((await kiki.read("状态.json")) || "null"); } catch { st = null; }
  render();
}

function cell(n, have) {
  if (!have) return `<span class="none">没装</span>`;
  return n ? `<span class="ok">${n}</span>` : `<span class="none">—</span>`;
}

function render() {
  if (!st) {
    $("sum").textContent = "";
    $("main").innerHTML = `<div class="card empty"><p>还没收过。点“现在收一次”，把这台电脑上 Claude 和 Codex 的东西收进一个文件夹。</p><p class="meta">只读本机文件，不联网，不花 token，不带登录凭证。</p></div>`;
    return;
  }
  $("sum").textContent = `${ago(st.at)} 收过 · ${st.conversations} 个对话`;
  $("notes").innerHTML = (st.notes || []).map((n) => `<li>${esc(n)}</li>`).join("");
  const h = st.handoff || {};
  $("main").innerHTML = `
    <section>
      <h2>七类家当</h2>
      <div class="tw"><table>
        <tr><th>家当</th><th>Claude</th><th>Codex</th><th>云端的去官网导出</th></tr>
        ${KINDS.map((k) => `<tr>
          <td>${esc(k.name)}${k.hint ? `<span class="sub">${esc(k.hint)}</span>` : ""}</td>
          <td class="n">${cell(st.counts?.[k.key]?.Claude, st.have?.Claude)}</td>
          <td class="n">${cell(st.counts?.[k.key]?.Codex, st.have?.Codex)}</td>
          <td>${k.cloud.map(([t, u]) => `<button class="btn link" data-href="${esc(u)}">${esc(t)}</button>`).join(" · ") || `<span class="none">本机文件夹里的不用搬</span>`}</td>
        </tr>`).join("")}
      </table></div>
      <p class="meta" style="margin-top:8px">文件夹：${esc(st.out)}${st.zip ? ` · 压缩包：${esc(st.zip)}` : ""}</p>
    </section>
    <section>
      <h2>写交接</h2>
      <div class="card">
        <p>让新 AI 一上来就懂你：默认行为、项目进度、你纠正过的地方，写成三份交接文档。素材只挑你自己说过的话（最近 ${h.months || 3} 个月，${h.projects || 0} 个项目，${h.corrections || 0} 条纠正），大约 <b>${kTok(h.tokens || 0)} token</b>。</p>
        <div class="acts">
          <button class="btn" data-ask="老号还能用，把三段写交接的咒语给我，我去贴给老 AI。">老号还在：让老 AI 写</button>
          <button class="btn primary" data-ask="写交接">让搬家宝写</button>
        </div>
      </div>
    </section>
    <section>
      <h2>搬进去</h2>
      <div class="card">
        <p>把整个文件夹交给新的 AI，或者直接搬进 Kiki 的宝里。原来的东西都会先备份，不覆盖。</p>
        <div class="acts">
          <button class="btn" data-ask="搬进去：我要搬到别的 AI。">搬到别的 AI</button>
          <button class="btn" data-ask="搬进去：搬进 Kiki。">搬进 Kiki</button>
        </div>
      </div>
    </section>`;
}

const say = (t) => { $("say").textContent = t; };
async function ask(text, note) {
  try { await kiki.ask(text); say(note || "交给搬家宝了，回话在左边对话里。"); } catch (e) { say(`没交出去：${e.message}`); }
}
$("go").onclick = () => ask("搬家：收一次本机家当", "在收了，几秒到一两分钟，收完这里会更新。");
$("zip").onclick = () => ask("收一次本机家当，并打包成 zip", "在收了，收完会打成 zip。");
$("open").onclick = () => ask("打开搬家文件夹");
document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.href) kiki.open(b.dataset.href);
  if (b.dataset.ask) ask(b.dataset.ask);
});
window.addEventListener("kiki:changed", load);
load();
</script>
</body>
</html>
